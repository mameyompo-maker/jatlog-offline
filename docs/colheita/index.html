<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JatLog</title>

<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#12140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JatLog">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" href="../icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<!-- barra de rede / fila de envio -->
<div id="barra" hidden></div>

<main id="palco">

  <!-- escolha do idioma (só nos ecrãs de entrada) -->
  <div class="idiomas" id="idiomas" hidden></div>

  <!-- A activação e o nome são pedidos uma só vez, no menu (../index.html).
       Este módulo começa já na escolha do local e do mês. -->

  <!-- ------------------------------------------------- 2. local e mês ---- -->
  <section class="ecra" id="ecraLocal" hidden>
    <div class="login-head">
      <div class="mark">JatLog</div>
      <h1 data-t="local.titulo"></h1>
      <p id="subLocal"></p>
    </div>
    <div class="painel">
      <div class="banner error" id="avisoLocal" hidden></div>

      <!-- O local escolhe-se sempre, sem nada pré-marcado: com um valor por
           omissão era fácil registar em Tanheia o que se pesou no 7 de Abril. -->
      <div class="campo" data-t="local.local"></div>
      <div id="escolhaLocal" class="escolhas-local"></div>

      <div class="duas" id="linhaMesAno">
        <div>
          <label class="campo" for="selMes" data-t="local.mes"></label>
          <select id="selMes"></select>
        </div>
        <div>
          <label class="campo" for="selAno" data-t="local.ano"></label>
          <select id="selAno"></select>
        </div>
      </div>
      <button class="btn principal" id="btnContinuar" data-t="local.botao"></button>
    </div>
    <div class="accoes">
      <button class="btn ligacao" id="btnMenu2" data-t="geral.menu"></button>
    </div>
    <div class="appfoot" data-t="app.rodape"></div>
  </section>

  <!-- ------------------------------------------------ barra de contexto ---- -->
  <div class="topbar" id="topo" hidden>
    <div class="who">
      <div class="name" id="topoNome"></div>
      <div class="month" id="topoMes"></div>
    </div>
    <div class="counter">
      <div class="num" id="topoNum">0</div>
      <div class="lbl" data-t="topo.registros"></div>
    </div>
  </div>

  <!-- --------------------------------------------------------- 3. busca ---- -->
  <section class="ecra" id="ecraBusca" hidden>
    <div id="linhaMesAdmin" hidden>
      <label class="campo" for="selMesAdmin" data-t="busca.mesAdmin"></label>
      <select id="selMesAdmin"></select>
    </div>

    <div class="banner error" id="avisoBusca" hidden></div>
    <div class="banner ok" id="avisoGravado" hidden></div>

    <div class="eyebrow" id="rotuloBusca"></div>
    <input type="text" id="inpBusca" class="busca" placeholder="1"
           inputmode="numeric" pattern="[0-9]*" enterkeyhint="search"
           autocomplete="off">

    <div class="banner info" data-t="busca.ajuda"></div>

    <button class="btn" id="btnHatena" data-t="busca.hatena" hidden></button>

    <div class="accoes">
      <button class="btn ligacao" id="btnMudarLocal" data-t="busca.mudarLocal"></button>
      <button class="btn ligacao" id="btnMenu" data-t="geral.menu"></button>
    </div>
  </section>

  <!-- ---------------------------------------------------- 4. candidatos ---- -->
  <section class="ecra" id="ecraCandidatos" hidden>
    <div class="banner warn" id="avisoCandidatos"></div>
    <div id="listaCandidatos"></div>
    <button class="btn" id="btnOutroNumero" data-t="candidatos.outro"></button>
  </section>

  <!-- ---------------------------------------------------------- 5. peso ---- -->
  <section class="ecra" id="ecraPeso" hidden>
    <div class="banner error" id="avisoPeso" hidden></div>
    <div class="banner warn" id="avisoJaRegistado" hidden></div>

    <div class="readout">
      <div class="tag" data-t="peso.tag"></div>
      <div class="line-code" id="pesoLinha"></div>
      <div class="sub" id="pesoSub"></div>
    </div>

    <input type="text" id="inpPeso" class="mostrador" placeholder="0.00"
           inputmode="decimal" enterkeyhint="done" autocomplete="off">

    <div class="segmento" id="segPeso">
      <button type="button" data-unidade="kg" class="activo">kg</button>
      <button type="button" data-unidade="g">g</button>
    </div>

    <div class="duas">
      <button class="btn principal" id="btnRegistar" data-t="peso.registar"></button>
      <button class="btn cancelar" id="btnCancelarPeso" data-t="peso.cancelar"></button>
    </div>

    <div class="meta">
      <div class="cell"><div class="k" data-t="peso.mae"></div><div class="v" id="metaMae">-</div></div>
      <div class="cell"><div class="k" data-t="peso.variedade"></div><div class="v" id="metaVariedade">-</div></div>
      <div class="cell"><div class="k" data-t="peso.saco"></div><div class="v" id="metaSaco">-</div></div>
      <div class="cell"><div class="k" data-t="peso.plantas"></div><div class="v" id="metaPlantas">-</div></div>
    </div>
  </section>

  <!-- ----------------------------------------------- 6. confirmar valor ---- -->
  <section class="ecra" id="ecraConfirmar" hidden>
    <div class="banner warn" id="avisoConfirmar"></div>
    <div class="readout">
      <div class="tag" data-t="confirmar.tag"></div>
      <div class="line-code" id="confirmarLinha"></div>
      <div class="sub" id="confirmarValor"></div>
    </div>
    <div class="duas">
      <button class="btn principal" id="btnRegistarAssim" data-t="confirmar.assim"></button>
      <button class="btn cancelar" id="btnCorrigir" data-t="confirmar.corrigir"></button>
    </div>
  </section>

  <!-- -------------------------------------------------------- 7. editar ---- -->
  <section class="ecra" id="ecraEditar" hidden>
    <div class="banner error" id="avisoEditar" hidden></div>
    <div class="banner warn" id="cabecalhoEditar"></div>

    <div class="readout">
      <div class="tag" data-t="editar.tag"></div>
      <div class="line-code" id="editarLinha"></div>
      <div class="sub" id="editarSub"></div>
    </div>

    <input type="text" id="inpEditar" class="mostrador" inputmode="decimal"
           enterkeyhint="done" autocomplete="off">

    <div class="segmento" id="segEditar">
      <button type="button" data-unidade="kg" class="activo">kg</button>
      <button type="button" data-unidade="g">g</button>
    </div>

    <div class="duas">
      <button class="btn principal" id="btnGuardarEdicao" data-t="editar.guardar"></button>
      <button class="btn cancelar" id="btnCancelarEdicao" data-t="editar.cancelar"></button>
    </div>

    <div class="accoes">
      <button class="btn apagar" id="btnApagar" data-t="editar.apagar"></button>
    </div>
  </section>

  <!-- -------------------------------------------------------- 8. apagar ---- -->
  <section class="ecra" id="ecraApagar" hidden>
    <div class="banner error" id="avisoApagarTexto"></div>
    <div class="readout">
      <div class="tag" data-t="apagar.tag"></div>
      <div class="line-code" id="apagarLinha"></div>
      <div class="sub" id="apagarSub"></div>
    </div>
    <!-- Aqui, e só aqui, a saída fica à esquerda. Em todos os outros ecrãs o
         botão da esquerda é o que executa (Registar, Guardar); manter essa
         ordem neste punha o apagar definitivo debaixo do polegar que já fez
         duas vezes "guardar". O ecrã de eliminar das medições já está assim. -->
    <div class="duas">
      <button class="btn cancelar" id="btnApagarNao" data-t="apagar.nao"></button>
      <button class="btn perigo" id="btnApagarSim" data-t="apagar.sim"></button>
    </div>
  </section>

  <!-- ------------------------------------------------------- histórico ---- -->
  <div id="historico" hidden>
    <div class="eyebrow" style="margin-top:26px" data-t="historico.titulo"></div>
    <div id="listaHistorico"></div>
  </div>

</main>

<div id="brinde" hidden></div>

<script src="../config.js"></script>
<script src="./i18n.js"></script>
<script src="./app.js"></script>
</body>
</html>
