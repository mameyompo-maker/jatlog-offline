<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JatLog</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#12140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JatLog">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<main id="palco">

  <!-- escolha do idioma: vale para os dois módulos -->
  <div class="idiomas" id="idiomas" hidden></div>

  <!-- ---------------------------------------------------- 0. activação ---- -->
  <section class="ecra" id="ecraActivacao" hidden>
    <div class="login-head">
      <div class="mark">JatLog</div>
      <h1 data-t="activacao.titulo"></h1>
      <p data-t="activacao.texto"></p>
    </div>
    <div class="painel">
      <div class="banner error" id="avisoActivacao" hidden></div>
      <div class="banner info" id="estadoActivacao" data-t="activacao.aVerificar" hidden></div>
      <label class="campo" for="inpCodigo" data-t="activacao.campo"></label>
      <input type="text" id="inpCodigo" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="btn principal" id="btnActivar" data-t="activacao.botao"></button>
    </div>
    <div class="appfoot" data-t="app.subtitulo"></div>
  </section>

  <!-- ------------------------------------------------------- 1. entrada ---- -->
  <section class="ecra" id="ecraEntrada" hidden>
    <div class="login-head">
      <div class="mark">JatLog</div>
      <h1 data-t="entrada.titulo"></h1>
      <p data-t="entrada.texto"></p>
    </div>
    <div class="painel">
      <div class="banner error" id="avisoEntrada" hidden></div>

      <div class="banner info" id="avisoAdminActivo" data-t="entrada.adminActivo" hidden></div>
      <button class="btn ligacao" id="btnSairAdmin" data-t="entrada.sairAdmin" hidden></button>

      <label class="campo" for="inpNome" data-t="entrada.nome"></label>
      <input type="text" id="inpNome" data-tph="entrada.nomePlaceholder" autocomplete="name"
             autocapitalize="words" enterkeyhint="go">

      <details id="blocoAdmin">
        <summary data-t="entrada.admin"></summary>
        <label class="campo" for="inpSenha" data-t="entrada.senha"></label>
        <input type="password" id="inpSenha" data-tph="entrada.senhaPlaceholder"
               autocomplete="off">
      </details>

      <button class="btn principal" id="btnComecar" data-t="entrada.botao"></button>
    </div>
    <div class="appfoot" data-t="app.rodape"></div>
  </section>

  <!-- ---------------------------------------------------------- 2. menu ---- -->
  <section class="ecra" id="ecraMenu" hidden>
    <div class="login-head">
      <div class="mark">JatLog</div>
      <h1 data-t="menu.titulo"></h1>
      <p id="subMenu"></p>
    </div>

    <div class="painel">
      <a class="cartao-menu" id="cartaoColheita" href="./colheita/">
        <span class="cartao-t" data-t="menu.colheita"></span>
        <span class="cartao-d" data-t="menu.colheitaDesc"></span>
        <span class="cartao-fila" id="filaColheita" hidden></span>
      </a>

      <a class="cartao-menu" id="cartaoIndia" href="./india/">
        <span class="cartao-t" data-t="menu.india"></span>
        <span class="cartao-d" data-t="menu.indiaDesc"></span>
        <span class="cartao-fila" id="filaIndia" hidden></span>
      </a>
    </div>

    <button class="btn ligacao" id="btnSairAdmin2" data-t="entrada.sairAdmin" hidden></button>
    <button class="btn ligacao" id="btnTrocarUsuario" data-t="geral.trocarUsuario"></button>
    <button class="btn ligacao" id="btnDesactivar" data-t="menu.desactivar"></button>

    <div class="appfoot" data-t="app.rodape"></div>
  </section>

</main>

<div id="brinde" hidden></div>

<script src="./config.js"></script>
<script src="./shell_i18n.js"></script>
<script src="./shell.js"></script>
</body>
</html>
