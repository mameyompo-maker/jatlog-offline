<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12140f">
<title>JatLog — Medições India</title>
<link rel="manifest" href="../manifest.webmanifest">
<!-- A mesma letra dos outros ecrãs. O Service Worker guarda as fontes numa cache
     própria (jatlog-fontes), por isso sem rede continua a ler-se.
     ⚠ O endereço tem de ser LETRA POR LETRA igual ao de ../index.html e
     ../colheita/index.html — a cache é indexada pelo pedido, e um endereço só
     com o Plex Sans seria outra entrada, que num telemóvel sem rede nunca
     estaria lá. Daí pedir também o Mono, que aqui não se usa.
     Se mesmo assim faltar, a folha de estilo cai para a letra do sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div id="barraEstado">
  <span id="pontoRede"></span>
  <span id="estadoTexto">Ligado</span>
  <span id="crachaAdmin" data-t="geral.admin" hidden></span>
  <span id="contadorFila" hidden>0</span>
</div>

<main>

<!-- escolha do idioma — só nos ecrãs de entrada -->
<div class="idiomas" id="idiomas" hidden></div>

<!-- A activação e o nome são pedidos uma só vez, no menu (../index.html).
     Este módulo começa já na escolha do levantamento. -->

<!-- ---------------------------------------------------- 2. levantamento ---- -->
<section class="ecra" id="ecraLevantamento" hidden>
  <h1 data-t="lev.titulo"></h1>
  <p class="sub" id="ola"></p>

  <button class="cartao" data-modo="crescimento">
    <b data-t="lev.crescimento"></b>
    <span data-t="lev.crescimento.desc"></span>
  </button>

  <button class="cartao" data-modo="descritores">
    <b data-t="lev.descritores"></b>
    <span data-t="lev.descritores.desc"></span>
  </button>

  <div class="accoes">
    <button class="ligacao" id="ligProgresso" data-t="lev.progresso"></button>
    <button class="ligacao" id="ligHistorico" data-t="lev.registos"></button>
    <button class="ligacao" id="ligMenu" data-t="geral.menu"></button>
  </div>
</section>

<!-- ----------------------------------------------------------- 3. ronda ---- -->
<section class="ecra" id="ecraRonda" hidden>
  <h1 data-t="ronda.titulo"></h1>
  <p class="sub" data-t="ronda.texto"></p>

  <label class="campo" for="inpRonda" data-t="ronda.campo"></label>
  <input type="text" id="inpRonda" autocomplete="off" data-tph="ronda.exemplo">
  <div id="rondasConhecidas"></div>

  <div class="aviso" id="avisoRonda" data-t="ronda.aviso"></div>

  <button class="btn" id="btnRonda" data-t="entrada.continuar"></button>
  <div class="accoes">
    <button class="ligacao" data-voltar="ecraLevantamento" data-t="geral.voltar"></button>
  </div>
</section>

<!-- ---------------------------------------------------------- 4. planta ----
     Tudo isto tem de caber num ecrã de telemóvel sem rolar: o "Continuar"
     estava a ficar por baixo da dobra e havia que arrastar para o encontrar.
     Daí o cabeçalho numa linha só, a grelha em 8 colunas e o botão fixo
     em baixo. -->
<section class="ecra compacto" id="ecraPlanta" hidden>
  <p class="sub linhaTopo" id="subPlanta"></p>

  <div class="grelhaFileiras" id="grelhaFileiras"></div>

  <div class="linhaNumero">
    <div id="visorNumero" class="vazio">—</div>
    <!-- Caso raro: fica de lado e pequeno para não roubar o sítio ao que se
         faz sempre. Só aparece depois de a planta estar escolhida. -->
    <div class="ladoDireito">
      <button class="ligacao discreta" id="ligProximaPorFazer" data-t="planta.proxima"></button>
      <button class="ligacao discreta" id="ligMorta" hidden></button>
    </div>
  </div>

  <div class="teclado" id="teclado">
    <button data-tecla="1">1</button><button data-tecla="2">2</button><button data-tecla="3">3</button>
    <button data-tecla="4">4</button><button data-tecla="5">5</button><button data-tecla="6">6</button>
    <button data-tecla="7">7</button><button data-tecla="8">8</button><button data-tecla="9">9</button>
    <button class="aux" data-tecla="limpar" data-t="planta.limpar"></button>
    <button data-tecla="0">0</button>
    <button class="aux" data-tecla="apagar">←</button>
  </div>

  <!-- Depois do teclado, não antes: se aparecesse aqui empurrava o número e o
       teclado para baixo mal se carregasse na fileira, e quem já tinha o
       polegar no sítio certo passava a acertar ao lado. -->
  <div id="resolvidoPlanta" hidden></div>

  <div class="barraFundo">
    <button class="btn" id="btnPlanta" data-t="entrada.continuar" disabled></button>
    <button class="ligacao centrado" data-voltar="ecraLevantamento" data-t="geral.voltar"></button>
  </div>
</section>

<!-- ------------------------------------------------------ 5. formulário ---- -->
<section class="ecra" id="ecraFormulario" hidden>
  <!-- Depois de gravar entra-se logo no formulário da planta seguinte. O
       cabeçalho diz qual é e serve de botão para a trocar, para não ser
       preciso voltar atrás só para acertar o número. -->
  <!-- A fileira vem primeiro e em grande (2026-08-18): é por aí que se
       confere no terreno. Linhagem e ronda ficam por baixo, secundárias. -->
  <button class="cabecalhoPlanta" id="cabecalhoPlanta">
    <span class="posFileira" id="subForm"></span>
    <span class="idPlanta" id="tituloForm"></span>
    <span class="linhagem" id="linhagemForm"></span>
    <span class="ronda" id="rondaForm" hidden></span>
    <span class="trocar" data-t="form.trocarPlanta"></span>
  </button>
  <div id="avisoEdicao" class="aviso" hidden></div>

  <!-- Marcar a planta morta sem ter de recuar ao ecrã do número: quando se vai
       a andar pela fileira, a planta seguinte já vem aberta e dar meia-volta só
       para dizer que está morta custava três toques. -->
  <button class="ligacao mortaForm" id="ligMortaForm"></button>

  <div id="camposForm"></div>

  <!-- A ordem é a de sempre: Voltar primeiro, Eliminar depois. Trocá-la punha o
       botão destrutivo no sítio onde a mão já sabia encontrar o Voltar. -->
  <div class="accoes">
    <button class="ligacao" id="ligTrocarPlanta" data-t="geral.voltar"></button>
    <button class="btn perigo" id="btnEliminar" data-t="form.eliminar" hidden></button>
  </div>

  <div class="barraFundo">
    <button class="btn" id="btnEnviar"></button>
  </div>
</section>

<!-- -------------------------------------------------------- 6. progresso ---- -->
<section class="ecra" id="ecraProgresso" hidden>
  <h1 data-t="prog.titulo"></h1>
  <p class="sub" id="subProgresso"></p>
  <div id="totalProgresso"></div>
  <div id="listaFileiras"></div>
  <div class="accoes">
    <button class="btn secundario" id="btnActualizarProgresso" data-t="prog.actualizar"></button>
    <button class="ligacao" data-voltar="ecraLevantamento" data-t="geral.voltar"></button>
  </div>
</section>

<!-- -------------------------------------------------------- 7. histórico ---- -->
<section class="ecra" id="ecraHistorico" hidden>
  <h1 data-t="hist.titulo"></h1>
  <p class="sub" id="subHistorico"></p>

  <!-- Procurar pela planta, e não pela ordem em que foi gravada. Quem vem
       aqui vem quase sempre corrigir uma planta concreta, e percorrer uma
       lista por data para a encontrar era o que estava a custar. A grelha é a
       mesma do ecrã de medição, para não haver dois sítios a aprender. -->
  <div class="grelhaFileiras" id="grelhaFileirasHist"></div>
  <div id="plantasDaFileira" hidden></div>

  <div class="abas" id="abasHistorico">
    <button class="aba activo" data-aba="aparelho" data-t="hist.aparelho"></button>
    <button class="aba" data-aba="todos" data-t="hist.todos"></button>
  </div>

  <ul class="listaEnvios" id="listaHistorico"></ul>

  <div class="accoes">
    <button class="btn secundario" id="btnForcarEnvio" data-t="hist.forcar"></button>

    <!-- Porque falhou o último envio. Sem isto, uma fila que não sobe não diz
         nada a quem está no campo — foi o que aconteceu a 13 de Agosto. -->
    <div class="aviso" id="avisoEnvio" hidden></div>

    <button class="ligacao" data-voltar="ecraLevantamento" data-t="geral.voltar"></button>
  </div>
</section>

</main>

<div id="brinde" hidden></div>

<!-- ------------------------------------------- diálogo: confirmar o registo --
     Aparece SEMPRE antes de gravar, não só quando falta alguma coisa: é o
     último sítio onde se vê o que se está prestes a mandar, e para que
     planta. Quando há campos por preencher, a pergunta vem primeiro pelo
     que a planta não tem ("não há fruto?") e só depois pelos campos. -->
<dialog id="dlgIncompleto">
  <h3 data-t="dlg.confirmarTitulo"></h3>
  <p class="alvoConfirmar" id="alvoConfirmar"></p>
  <div id="semObjectos"></div>
  <div id="resumoValores"></div>
  <details id="detalheVazios">
    <summary data-t="dlg.verCamposVazios"></summary>
    <ul id="listaVazios"></ul>
  </details>
  <p class="notaDialogo" data-t="dlg.faltamNota"></p>
  <!-- O confirmar fica à esquerda, tal como no resto da app — mesma ordem
       em todo o lado (2026-08-28). -->
  <div class="dialogoBotoes">
    <button class="btn" id="btnEnviarAssim" data-t="dlg.confirmar"></button>
    <button class="btn secundario" id="btnVoltarPreencher" data-t="dlg.corrigir"></button>
  </div>
</dialog>

<!-- ------------------------------------------- diálogo: eliminar registo -- -->
<dialog id="dlgEliminar">
  <h3 data-t="dlg.eliminarTitulo"></h3>
  <p id="textoEliminar"></p>
  <ul id="listaEliminar"></ul>
  <p data-t="dlg.eliminarNota"></p>
  <div class="dialogoBotoes">
    <button class="btn secundario" id="btnNaoEliminar" data-t="geral.voltar"></button>
    <button class="btn perigo" id="btnConfirmarEliminar" data-t="dlg.eliminar"></button>
  </div>
</dialog>

<script src="../config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
